[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.21"
optimizer = true
optimizer_runs = 200
evmVersion = "shanghai"
verbosity = 1
fs_permissions = [
    { access = "read", path = "./out/" },
    { access = "read-write", path = "./script/output/" }
]

invariant.runs = 64
invariant.depth = 64
invariant.fail_on_revert = true

[rpc_endpoints]
mainnet = "${ETH_RPC_URL}"

# See more config options https://github.com/foundry-rs/foundry/tree/master/config

[lint]
lint_on_build = false
